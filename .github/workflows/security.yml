name: Security
on: [workflow_call]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install --upgrade pip==26.2.1 && pip install -r backend/requirements.lock
      - run: bandit -r backend/app -ll
      - run: pip-audit
      - run: pip-audit -r backend/requirements-runtime.lock
      - run: npm --prefix frontend ci && npm --prefix frontend audit --audit-level=high
      - name: Source and secret scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scanners: vuln,secret
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
