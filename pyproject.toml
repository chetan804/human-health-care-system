[project]
name = "human-health-care-system"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2,<3",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
  "argon2-cffi>=23,<26", "PyJWT>=2.10,<3", "cryptography>=44",
  "email-validator>=2,<3", "redis>=5,<8", "celery>=5.4,<6", "httpx>=0.28,<1", "prometheus-client>=0.21,<1"
]
[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=6", "ruff>=0.9", "bandit>=1.8", "pip-audit>=2.8"]
[tool.setuptools.packages.find]
include = ["backend*"]
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008"]
